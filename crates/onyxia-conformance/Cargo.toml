[package]
name = "onyxia-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "ONNX operator conformance harness for Onyxia: runs the official onnx node tests through lowering and a backend."
publish = false

[dependencies]
onyxia-onnx.workspace = true
onyxia-ir.workspace = true
onyxia-lower.workspace = true
onyxia-backend-ref.workspace = true
onyxia-backend-wgpu = { workspace = true, optional = true }
onyxia-backend-cubecl = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }
prost = "0.14.3"

[features]
default = []
# Run the node tests on the wgpu backend as well (`--backend wgpu`).
wgpu = ["dep:onyxia-backend-wgpu", "dep:pollster"]
# Run the node tests on the CubeCL backend (`--backend cubecl`).
cubecl = ["dep:onyxia-backend-cubecl", "dep:pollster"]

[[bin]]
name = "onyxia-conformance"
path = "src/main.rs"
